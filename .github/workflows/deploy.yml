name: Deploy Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: self-hosted # Menggunakan runner yang kamu install di VPS
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          cd /var/www/wip-web
          git fetch origin production
          git reset --hard origin/production
          npm install

      - name: Build Next.js
        run: |
          cd /var/www/wip-web
          rm -rf .next
          npm run build

      - name: Restart PM2
        run: |
          cd /var/www/wip-web
          # Menjalankan reload jika sudah ada, atau start jika baru pertama kali
          pm2 delete wip-frontend || true
          pm2 start npm --name "wip-frontend" -- start -- -p 3000
          pm2 save
